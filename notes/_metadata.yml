# Applies to every page under notes/ (the listing and all posts).
# Lists the site-wide files again so these lists add to them rather than
# replacing them; the notes-specific file comes last in each list.
format:
  html:
    css:
      - ../styles.css
      - notes.css
    include-after-body:
      - ../nav-preview.html
      - collapse-proofs.html
