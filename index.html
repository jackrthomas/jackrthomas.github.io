<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jack Thomas</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #222222;
            --card: #f4f4f6;
            --accent: #5b3069;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #16161a;
                --fg: #e8e8ea;
                --card: #222228;
                --accent: #b58bc4;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 16px;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        h1 {
            margin: 0 0 2rem;
            font-weight: 600;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }
        .links a {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 280px;
            max-width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: var(--card);
            color: var(--fg);
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .links a:hover,
        .links a:focus-visible {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            outline: 2px solid var(--accent);
        }
        .links img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
        }
        .links span {
            margin-top: 0.75rem;
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1>Jack Thomas</h1>
    <nav class="links">
        <a href="https://jack.thomaslabs.co.uk/">
            <img src="https://jack.thomaslabs.co.uk/images/jt4-square.png" alt="Jack Thomas homepage">
            <span>Homepage</span>
        </a>
        <a href="https://jackrthomas.github.io/Math5485/">
            <img src="https://jackrthomas.github.io/Math5485/images/PCA-5485-2.gif" alt="Math 5485 course page">
            <span>Math 5485</span>
        </a>
    </nav>
</body>
</html>
